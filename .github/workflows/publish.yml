name: Publish to PyPI

# Trusted publishing (OIDC) - no API tokens in secrets.
# Triggers: pushing a version tag (v*) builds and publishes; a manual
# workflow_dispatch run only builds and checks (the publish job is
# tag-gated) - use it as a dry run.
# One-time setup at https://pypi.org/manage/account/publishing/ :
#   PyPI Publisher: this repository, workflow file "publish.yml",
#   environment name "pypi" (create the environment in repo Settings >
#   Environments first). For a dry run, register the same against
#   test.pypi.org and use the commented TestPyPI lines below.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Check distributions
        run: |
          pip install dist/*.whl
          python - <<'EOF'
          import asyncio, musescore_mcp
          from musescore_mcp.server import MuseScoreMCP
          tools = asyncio.run(MuseScoreMCP().mcp.list_tools())
          assert len(tools) == 7, f"expected 7 tools, got {len(tools)}"
          print("wheel ok:", musescore_mcp.__version__)
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # For a TestPyPI dry run, replace the lines above with:
        #   uses: pypa/gh-action-pypi-publish@release/v1
        #   with:
        #     repository-url: https://test.pypi.org/legacy/
